# Site configuration for shokunin.one, built with `make build`.
# The paths are relative to the repository root.

site_name = "Shokunin"
site_title = "Shokunin is now Static Site Generator (ssg)"
site_description = "Shokunin, the Rust static site generator, was renamed Static Site Generator (ssg) in version 0.0.36. This site explains the rename and how to install, build and check a site with ssg 0.0.69."
base_url = "https://shokunin.one"
language = "en-GB"

content_dir = "_posts"
template_dir = "_layouts"
output_dir = "docs"

# Agentic discovery: /agents.txt, /.well-known/ai-plugin.json and
# /.well-known/mcp.json. Permissive, because the site exists to be read.
[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

# Security headers for hosts that read `_headers`. GitHub Pages ignores the
# file; it is kept so the same build deploys elsewhere with the headers.
[edge_headers]
targets = ["netlify", "cloudflare"]
