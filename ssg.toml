# Site configuration for static-site-generator.com, built with `make build`.
# The paths are relative to the repository root.

site_name = "Static Site Generator"
site_title = "Static Site Generator (ssg): a Rust static site generator that checks what it builds"
site_description = "Static Site Generator (ssg) is an open-source static site generator written in Rust. It builds a site from Markdown and templates, scores it on a ten-pillar quality gate and audits the output on fifteen gates."
base_url = "https://static-site-generator.com"
language = "en-GB"

content_dir = "_posts"
template_dir = "_layouts"
output_dir = "docs"

# Agentic discovery: /agents.txt, /.well-known/ai-plugin.json and
# /.well-known/mcp.json. Permissive, because the site exists to be read.
[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

# Security headers for hosts that read `_headers`. GitHub Pages ignores the
# file; it is kept so the same build deploys elsewhere with the headers.
[edge_headers]
targets = ["netlify", "cloudflare"]
