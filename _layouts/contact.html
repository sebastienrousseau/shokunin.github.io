{{#extends "base"}}
{{#block "main"}}
<article class="section">
  <div class="container narrow stack">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <p class="lead">{{lead}}</p>

    <div class="prose">{{!content}}</div>

    <!--
      Posts to the Formspree endpoint the previous site used;
      base.html allows that origin in the form-action policy.
    -->
    <form class="stack" action="https://formspree.io/f/mqkvgqpg" method="post">
      <div class="field">
        <label for="cf-name">Your name</label>
        <input id="cf-name" name="name" type="text" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="cf-email">Email address</label>
        <input id="cf-email" name="email" type="email" autocomplete="email" required />
        <p class="hint" id="cf-email-hint">Used only to reply to this enquiry.</p>
      </div>
      <div class="field">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" required></textarea>
      </div>
      <div class="cta-row">
        <button class="btn btn-primary" type="submit">Send enquiry</button>
      </div>
    </form>
  </div>
</article>
{{/block}}
