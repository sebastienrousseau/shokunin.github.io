<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{site_path}}" rel="home">
      <span class="brand-mark" aria-hidden="true">ssg</span>
      <span class="brand-text">Static Site Generator</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <!-- Always present; CSS hides it above 48rem. -->
      <button
        class="nav-toggle"
        id="navToggle"
        type="button"
        aria-expanded="false"
        aria-controls="navMenu"
      >
        <span class="visually-hidden">Menu</span>
        <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <line x1="5" y1="5" x2="19" y2="19" />
          <line x1="19" y1="5" x2="5" y2="19" />
        </svg>
      </button>

      <ul class="nav-menu" id="navMenu">
        <li>
          <a class="nav-link" href="{{site_path}}features/" {{#if nav_features}}aria-current="page"{{/if}}>Features</a>
        </li>
        <li>
          <a class="nav-link" href="{{site_path}}getting-started/" {{#if nav_docs}}aria-current="page"{{/if}}>Get started</a>
        </li>
        <li>
          <a class="nav-link" href="{{site_path}}documentation/" {{#if nav_reference}}aria-current="page"{{/if}}>Reference</a>
        </li>
        <li>
          <a class="nav-link" href="https://themes.static-site-generator.com/">Themes</a>
        </li>
        <li>
          <a class="nav-link" href="{{site_path}}security/" {{#if nav_security}}aria-current="page"{{/if}}>Security</a>
        </li>
        <li>
          <a class="nav-link" href="{{site_path}}faqs/" {{#if nav_faqs}}aria-current="page"{{/if}}>FAQ</a>
        </li>
      </ul>

      <!-- Icon swapped by CSS on [data-theme]; no scripted relabelling. -->
      <!-- Search trigger slot. The generator replaces this element with
           the search button (see SEARCH_SLOT_ATTR in src/plugins/search.rs);
           with no slot the button is position:fixed in the viewport corner
           and cannot align with this header. -->
      <span data-ssg-search></span>
      <button
        class="theme-toggle"
        id="mode-toggle"
        type="button"
        data-label-light="Light"
        data-label-dark="Dark"
      >
        <span class="visually-hidden">Theme</span>
        <span class="visually-hidden" id="mode-state" data-label-system="System">System</span>
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </nav>
  </div>
</header>
